/* ═══ TASTATUR ═══ */
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable))return;
  if((e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z")){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&(e.key==="y"||e.key==="Y")){e.preventDefault();redo();return}
  if(e.key==="Escape"){if(activeTool){setTool("");return}if(selection.size){clearSel();return}closePopover();return}
  if((e.key==="Delete"||e.key==="Backspace")&&selection.size){e.preventDefault();deleteSelection();return}
  if((e.ctrlKey||e.metaKey)&&(e.key==="l"||e.key==="L")){e.preventDefault();e.shiftKey?unlinkSelection():linkSelection();return}
  if((e.ctrlKey||e.metaKey)&&(e.key==="d"||e.key==="D")){e.preventDefault();duplicateSelection();return}
  if((e.ctrlKey||e.metaKey)&&(e.key==="a"||e.key==="A")){e.preventDefault();selectAll();return}
  if(e.key.startsWith("Arrow")&&selection.size){
    e.preventDefault();
    const st=e.shiftKey?10:1,dx=e.key==="ArrowLeft"?-st:e.key==="ArrowRight"?st:0,dy=e.key==="ArrowUp"?-st:e.key==="ArrowDown"?st:0;
    moveClosure([...selection]).forEach(i=>{const o=objById(i);if(o){o.x+=dx;o.y+=dy}});
    render();
  }
});

/* ═══ BESTÄTIGUNGSDIALOG ═══
   Ersetzt die Browser-Abfrage: eigener Dialog im Stil der App, liefert ein
   Promise. Enter bestätigt, Esc oder Klick daneben bricht ab; solange er offen
   ist, gehen keine Tasten an den Plan durch. */
let cfResolve=null;
function askConfirm(opts){
  const o=typeof opts==="string"?{message:opts}:(opts||{});
  closeConfirm(false);
  return new Promise(resolve=>{
    cfResolve=resolve;
    const danger=o.danger!==false,col=danger?"var(--red)":"var(--accent)";
    document.getElementById("confirmRoot").innerHTML=`<div class="modal-overlay confirm-overlay" id="cfOverlay">
      <div class="modal confirm-modal" role="alertdialog" aria-modal="true" style="border:1px solid ${danger?"rgba(239,83,80,.32)":"rgba(46,156,255,.32)"}">
        <div class="modal-head"><h2 class="mono" style="color:${col}"><span>${o.icon||"⚠"}</span> ${escH(o.title||"Löschen?")}</h2></div>
        <div class="modal-body">
          <div class="cf-msg">${escH(o.message||"")}</div>
          ${o.detail?`<div class="cf-detail">${o.detail}</div>`:""}
          ${o.hint?`<div class="cf-hint">${escH(o.hint)}</div>`:""}
        </div>
        <div class="cf-actions">
          ${o.single?"":`<button class="btn btn-a cf-btn" id="cfCancel">Abbrechen</button>`}
          <button class="btn ${danger?"btn-r":"btn-a"} cf-btn" id="cfOk">${escH(o.ok||"Löschen")}</button>
        </div>
      </div></div>`;
    const ov=document.getElementById("cfOverlay");
    ov.addEventListener("mousedown",e=>{if(e.target===ov)closeConfirm(false)});
    document.getElementById("cfCancel")?.addEventListener("click",()=>closeConfirm(false));
    document.getElementById("cfOk").addEventListener("click",()=>closeConfirm(true));
    document.addEventListener("keydown",cfKey,true);
    setTimeout(()=>document.getElementById("cfOk")?.focus(),0);
  });
}
function cfKey(e){
  if(!cfResolve)return;
  if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeConfirm(false);return}
  if(e.key==="Enter"||e.key===" "){if(document.activeElement?.id==="cfCancel"&&e.key===" ")return;e.preventDefault();e.stopPropagation();closeConfirm(document.activeElement?.id!=="cfCancel");return}
  if(e.key==="Tab"){e.preventDefault();e.stopPropagation();const b=[document.getElementById("cfCancel"),document.getElementById("cfOk")].filter(Boolean);b[(b.indexOf(document.activeElement)+1)%b.length].focus();return}
  e.stopPropagation();
}
/* Hinweis mit einem Button — Ersatz für alert() */
function showAlert(opts){const o=typeof opts==="string"?{message:opts}:(opts||{});return askConfirm({...o,single:true,ok:o.ok||"OK",danger:o.danger===true})}
function closeConfirm(val){
  if(!cfResolve)return;
  const r=cfResolve;cfResolve=null;
  document.removeEventListener("keydown",cfKey,true);
  document.getElementById("confirmRoot").innerHTML="";
  r(!!val);
}

/* ═══ PNG-EXPORT ═══
   Rendert die Arbeitsfläche über html2canvas (wird bei Bedarf nachgeladen).
   Dafür wird die Fläche kurz auf Zoom 100 % gesetzt und so verschoben, dass
   alle Objekte im positiven Bereich liegen; danach wird alles zurückgestellt. */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Laden fehlgeschlagen: "+src));document.head.appendChild(s)})}
async function exportPNG(){
  if(!allObjs().length){showAlert({title:"Nichts zu exportieren",icon:"ℹ",ok:"Verstanden",message:"Der Plan ist leer."});return}
  const btn=document.getElementById("pngBtn"),old=btn?.textContent;
  if(btn){btn.disabled=true;btn.textContent="… PNG"}
  try{
    if(!window.html2canvas)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  }catch(err){
    if(btn){btn.disabled=false;btn.textContent=old}
    showAlert({title:"PNG-Export nicht verfügbar",icon:"⚠",danger:true,ok:"Schließen",message:"Die Bibliothek html2canvas konnte nicht geladen werden.",hint:"Internetverbindung prüfen — alternativ Bildschirmfoto verwenden"});return;
  }
  histCommit();closePopover();closeModal();clearSel();setTool("");
  if(activeTab!=="topo")switchTab("topo");
  renderPL();
  /* Bildausschnitt: alle Objekte plus Beschriftungen, mit Rand */
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  allObjs().forEach(o=>{const b=objBBox(o);x1=Math.min(x1,b.x1);y1=Math.min(y1,b.y1);x2=Math.max(x2,b.x2);y2=Math.max(y2,b.y2)});
  if(portsVisible())conns.forEach(c=>{if(c.lx!=null){x1=Math.min(x1,c.lx-10);y1=Math.min(y1,c.ly-10);x2=Math.max(x2,c.lx+90);y2=Math.max(y2,c.ly+24)}});
  const PAD=48;x1-=PAD;y1-=PAD;x2+=PAD;y2+=PAD;
  const W=Math.ceil(x2-x1),H=Math.ceil(y2-y1),scale=Math.max(1,Math.min(2,8000/Math.max(W,H)));
  const oldTf=world.style.transform,oldVpOv=vp.style.overflow,oldBodyOv=document.body.style.overflow;
  document.body.classList.add("exporting");
  world.style.transform=`translate(${-x1}px,${-y1}px)`;vp.style.overflow="visible";document.body.style.overflow="visible";
  try{
    /* Ziel ist die Arbeitsfläche (nicht das größenlose Welt-Element); das
       Klonfenster wird so groß gemacht, dass der Ausschnitt hineinpasst */
    const r=vp.getBoundingClientRect();
    const canvas=await html2canvas(vp,{width:W,height:H,scale,backgroundColor:isPaper()?(getComputedStyle(document.documentElement).getPropertyValue("--paper-bg").trim()||"#dfe2e7"):"#06090f",logging:false,useCORS:true,
      windowWidth:Math.max(window.innerWidth,r.left+W+40),windowHeight:Math.max(window.innerHeight,r.top+H+40),scrollX:0,scrollY:0});
    const a=document.createElement("a");a.href=canvas.toDataURL("image/png");a.download=isSketch()?"netzwerkskizze.png":"netzwerkplan.png";a.click();
  }catch(err){
    showAlert({title:"PNG-Export fehlgeschlagen",icon:"⚠",danger:true,ok:"Schließen",message:"Das Bild konnte nicht erzeugt werden.",detail:`<span class="mono">${escH(err?.message||err)}</span>`});
  }finally{
    document.body.classList.remove("exporting");
    world.style.transform=oldTf;vp.style.overflow=oldVpOv;document.body.style.overflow=oldBodyOv;
    if(btn){btn.disabled=false;btn.textContent=old}
    applyTf();
  }
}

function handleImport(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=function(e){try{applyImport(JSON.parse(e.target.result));const btn=document.getElementById("impBtn");btn.textContent="✓ OK";btn.style.color="var(--green)";setTimeout(()=>{btn.textContent="↑ Import";btn.style.color="var(--orange)"},1200)}catch(err){showAlert({title:"Import fehlgeschlagen",icon:"⚠",danger:true,ok:"Schließen",message:"Die Datei konnte nicht gelesen werden.",detail:`<span class="mono">${escH(err.message)}</span>`,hint:"Erwartet wird eine JSON-Datei aus „↓ Export“"})}};r.readAsText(file);ev.target.value=""}
function applyImport(d){
  if(d.version>=2||d.nodes){nodes=d.nodes||[];conns=d.connections||[];shapes=d.shapes||[]}
  else{showAlert({title:"Format nicht unterstützt",icon:"⚠",danger:true,ok:"Schließen",message:"Diese Datei enthält keinen Netzwerkplan im erwarteten Format.",hint:"Erwartet wird eine JSON-Datei aus „↓ Export“ (Version 2 oder 3)"});return}
  if(d.mode!==undefined||d.paper!==undefined||d.paperDetail!==undefined||d.tileScale!==undefined||d.portsSketch!==undefined||d.portsDetail!==undefined)readViewSettings(d);
  /* mitgelieferte eigene Symbole übernehmen, vorhandene nicht überschreiben */
  let full=false;
  if(d.images&&typeof d.images==="object"){
    let added=0;
    for(const id in d.images){
      const im=d.images[id];
      if(!images[id]&&im&&isImgData(im.data)){images[id]={name:String(im.name||"Bild").slice(0,40),data:im.data,w:+im.w||0,h:+im.h||0,t:Date.now()};added++}
    }
    if(added&&!saveImages())full=true;
  }
  normalizeLoadedData(true);
  setMode(mode,true);
  render();refreshPictUI();requestAnimationFrame(()=>setTimeout(centerView,60));
  if(full)showAlert({title:"Speicher voll",icon:"⚠",danger:true,ok:"Schließen",message:"Der Plan wurde geladen, die enthaltenen eigenen Symbole passen aber nicht mehr in den Browser-Speicher.",hint:"Nicht mehr benötigte eigene Symbole löschen und erneut importieren"});
}

/* ═══ INIT ═══ */
loadImages();loadLocalState();applyTileUI();
window.addEventListener("beforeunload",()=>{if(lsSaveTimer)clearTimeout(lsSaveTimer);saveLocalState()});
buildSkBar();setMode(mode,true);
(function(){
  const tr=document.getElementById("skTrack");if(!tr)return;
  tr.addEventListener("scroll",skNavUpdate,{passive:true});
  /* senkrechtes Mausrad blättert waagerecht */
  tr.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){tr.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
  window.addEventListener("resize",skNavUpdate);
})();
layoutHeader();applyAnim();applyGuidesBtn();applyPortsBtn();applyPenUI();render();histReset();requestAnimationFrame(()=>{layoutHeader();setTimeout(centerView,60)});
</script>
