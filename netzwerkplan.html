<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netzwerkplan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper-bg:#dfe2e7;--bg:#06090f;--bright:#dce8f8;--text:#8a9db8;--muted:#3e5068;--accent:#2e9cff;--green:#22d68a;--orange:#f5923a;--red:#ef5350;--purple:#a855f7;--yellow:#d4aa32;--teal:#20c9b0;--blue2:#5b8af5;--green2:#5ee85e}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;overflow:hidden;user-select:none}
.mono{font-family:'JetBrains Mono','Fira Code',monospace}
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(6,9,15,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(26,37,64,.4);padding:7px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px}
.header h1{font-size:15px;font-weight:700;color:var(--bright)}.header h1 em{color:var(--accent);font-style:normal}
.toolbar{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:5px;padding:4px 9px;font-size:8.5px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-weight:600;transition:all .15s;white-space:nowrap}.btn:hover:not(:disabled){filter:brightness(1.25);transform:translateY(-1px)}
.btn:disabled{opacity:.3;cursor:default;filter:none;transform:none}
.btn-ico{padding:3px 7px;font-size:12px;line-height:1}
.btn-a{background:rgba(46,156,255,.1);border:1px solid rgba(46,156,255,.25);color:var(--accent)}
.btn-g{background:rgba(34,214,138,.1);border:1px solid rgba(34,214,138,.25);color:var(--green)}
.btn-o{background:rgba(245,146,58,.1);border:1px solid rgba(245,146,58,.25);color:var(--orange)}
.btn-t{background:rgba(32,201,176,.1);border:1px solid rgba(32,201,176,.25);color:var(--teal)}
.btn-r{background:rgba(239,83,80,.1);border:1px solid rgba(239,83,80,.25);color:var(--red)}
.zoom-bar{display:flex;align-items:center;gap:4px;margin-left:auto}
.zoom-bar label{font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.zoom-bar input[type=range]{width:60px;accent-color:var(--accent);cursor:pointer;height:14px}
.field input[type=range]{padding:0;border:none;background:none;accent-color:var(--accent);height:20px;cursor:pointer}
.zoom-val{font-size:8px;color:var(--accent);min-width:26px;text-align:center}
.tab-bar{position:fixed;top:var(--hh,46px);left:0;right:0;z-index:99;background:rgba(6,9,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(26,37,64,.35);display:flex;padding:0 16px;gap:2px}
.tab-btn{padding:6px 14px;font-size:9.5px;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s}.tab-btn:hover{color:var(--text)}.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(46,156,255,.04)}
.tab-content{display:none}.tab-content.active{display:block}
.viewport{position:fixed;top:calc(var(--hh,46px) + 32px + var(--sb,0px));left:0;right:0;bottom:0;overflow:hidden;cursor:grab}.viewport.panning{cursor:grabbing}
.world{position:absolute;transform-origin:0 0;will-change:transform}
.world svg{position:absolute;top:0;left:0;z-index:1;overflow:visible;pointer-events:none}
.world svg .conn-hit{pointer-events:all;cursor:pointer}
.world svg .wp-handle{pointer-events:all;cursor:grab}
.table-view{position:fixed;top:calc(var(--hh,46px) + 32px + var(--sb,0px));left:0;right:0;bottom:0;overflow:auto;padding:14px 18px 40px;background:var(--bg)}
.tv-section{max-width:1020px;margin:0 auto 20px}
.tv-title{font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--bright);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.tv-count{font-size:8px;color:var(--muted);background:rgba(255,255,255,.04);border-radius:10px;padding:1px 7px}
table.nt{width:100%;border-collapse:collapse;font-size:9.5px}
table.nt th{text-align:left;padding:5px 8px;font-size:7.5px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid rgba(26,37,64,.5);font-weight:500}
table.nt td{padding:5px 8px;border-bottom:1px solid rgba(26,37,64,.2);vertical-align:middle}
table.nt tr:hover td{background:rgba(46,156,255,.03)}
table.nt textarea{background:rgba(0,0,0,.3);border:1px solid #1c2844;border-radius:3px;padding:2px 5px;color:var(--bright);font-size:9.5px;font-family:'JetBrains Mono',monospace;outline:none;width:100%;resize:vertical;min-height:22px;field-sizing:content}
table.nt input[type=color]{width:24px;height:20px;border:1px solid #1c2844;border-radius:3px;background:rgba(0,0,0,.3);cursor:pointer;padding:1px}
.cd{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.t-rm{width:20px;height:20px;border-radius:3px;border:none;background:rgba(239,83,80,.08);color:var(--red);font-size:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.t-rm:hover{background:rgba(239,83,80,.2)}
.vb{display:inline-block;padding:2px 7px;border-radius:4px;font-size:8.5px;font-family:'JetBrains Mono',monospace;font-weight:600}
.tv-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:7px 10px;background:rgba(0,0,0,.15);border-radius:7px;border:1px solid rgba(26,37,64,.2)}
.tv-legend-item{display:flex;align-items:center;gap:3px;font-size:8px;color:var(--muted)}
.node{position:absolute;border-radius:10px;padding:calc(8px*var(--s,1)) calc(10px*var(--s,1));cursor:grab;transition:border-color .2s,box-shadow .2s,background .15s;z-index:3;backdrop-filter:blur(6px)}.node:hover{z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.35)}.node.dragging-node{cursor:grabbing;z-index:20;opacity:.9;transition:none}
/* Lange Bezeichnungen brechen um, statt aus der Kachel zu laufen; das ✕ bleibt
   dabei oben rechts stehen */
.n-head{display:flex;align-items:flex-start;gap:4px;margin-bottom:2px}.n-icon{font-size:calc(11px*var(--s,1));line-height:1.3;flex:0 0 auto}
.n-label{font-size:calc(9.5px*var(--s,1));font-weight:700;letter-spacing:.02em;line-height:1.3;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.n-sub{font-size:calc(7px*var(--s,1));opacity:.6;margin-top:1px;overflow-wrap:anywhere}
.n-detail{font-size:calc(7.5px*var(--s,1));color:var(--muted);margin-top:2px;line-height:1.3;min-height:1.3em;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:2px;background:rgba(0,0,0,.25);border:1px solid rgba(26,37,58,.8);border-radius:3px;padding:1px 5px;font-size:calc(7.5px*var(--s,1));cursor:pointer;transition:all .12s}.chip:hover{border-color:currentColor;background:rgba(255,255,255,.04)}
.del-chip{margin-left:auto;flex:0 0 auto;align-self:flex-start;color:var(--red);font-size:7px;padding:1px 3px;cursor:pointer;opacity:.3;transition:opacity .15s}.del-chip:hover{opacity:1}
.cloud-node{position:absolute;z-index:3;cursor:grab;text-align:center;transition:box-shadow .2s,opacity .2s}
/* die Wolke hat eine feste Form — hier wird gekürzt statt umgebrochen */
.cl-label,.cl-sub{max-width:108px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cloud-node:hover{z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.35)}.cloud-node.dragging-node{cursor:grabbing;z-index:20;opacity:.85;transition:none}
.group-node{position:absolute;z-index:0;cursor:grab;transition:border-color .2s,background .2s,box-shadow .2s}
.group-node.dragging-node{cursor:grabbing;opacity:.9;transition:none}
.group-node.drop-target{box-shadow:0 0 0 2px rgba(46,156,255,.35),0 8px 30px rgba(0,0,0,.35)}
.group-node .g-head{display:flex;align-items:center;gap:4px;padding:5px 7px;pointer-events:none}
.group-node .g-title{font-size:9.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.group-node .g-count{font-size:7px;color:var(--muted);background:rgba(255,255,255,.05);border-radius:8px;padding:0 5px;flex:0 0 auto}
.group-node .del-chip{pointer-events:all}
.group-node .g-res{position:absolute;right:2px;bottom:2px;width:11px;height:11px;border-right:1.5px solid;border-bottom:1.5px solid;border-radius:0 0 4px 0;cursor:nwse-resize;opacity:.45}
.group-node .g-res:hover{opacity:1}
.gh-link{position:fixed;left:10px;bottom:9px;z-index:95;display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:8px;font-family:'JetBrains Mono',monospace;color:var(--text);text-decoration:none;background:rgba(6,9,15,.92);border:1px solid rgba(46,156,255,.22);border-radius:6px;backdrop-filter:blur(8px);box-shadow:0 1px 4px rgba(0,0,0,.18);transition:color .15s,border-color .15s}
.gh-link:hover{color:var(--accent);border-color:rgba(46,156,255,.55)}
.port-label{position:absolute;z-index:8;cursor:grab;display:flex;align-items:flex-start;gap:2px;user-select:none}
.port-label.dragging{cursor:grabbing;z-index:20;opacity:.85}
.port-label .pl-dot{width:4px;height:4px;border-radius:50%;opacity:.6;flex-shrink:0;margin-top:5px}
.port-label textarea{background:rgba(6,9,15,.92);border:1px solid rgba(100,120,160,.25);border-radius:3px;padding:2px 4px;font-size:7px;font-family:'JetBrains Mono',monospace;outline:none;text-align:center;min-width:30px;width:50px;min-height:16px;height:16px;backdrop-filter:blur(4px);cursor:pointer;color:inherit;resize:none;overflow:hidden;line-height:1.4}
.port-label textarea:focus{border-color:rgba(200,200,255,.45);cursor:text;overflow:auto}
.port-label .pl-rm{width:11px;height:11px;border-radius:2px;border:none;background:rgba(239,83,80,.1);color:var(--red);font-size:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:0;transition:opacity .12s;flex-shrink:0;margin-top:2px}.port-label:hover .pl-rm{opacity:1}
.conn-popover{position:fixed;z-index:50;background:linear-gradient(180deg,#151d2f,#111827);border:1px solid rgba(46,156,255,.3);border-radius:10px;min-width:280px;box-shadow:0 16px 50px rgba(0,0,0,.6);animation:cpop .15s ease}
@keyframes cpop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.conn-popover .cp-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:grab;border-bottom:1px solid rgba(46,156,255,.15);border-radius:10px 10px 0 0;background:rgba(46,156,255,.04)}
.conn-popover .cp-head.dragging-pop{cursor:grabbing}
.conn-popover .cp-title{font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent)}
.conn-popover .cp-close{width:20px;height:20px;border-radius:4px;border:none;background:rgba(255,255,255,.06);color:var(--muted);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.conn-popover .cp-body{padding:10px 12px;max-height:calc(100vh - 110px);overflow:auto}
.conn-popover .cp-field{margin-bottom:6px}
.conn-popover .cp-field label{display:block;font-size:7.5px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.conn-popover .cp-field select,.conn-popover .cp-field input,.conn-popover .cp-field textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid #1c2844;border-radius:5px;padding:5px 7px;color:var(--bright);font-size:10.5px;outline:none}
.conn-popover .cp-field textarea{font-family:'JetBrains Mono',monospace;resize:vertical;min-height:28px;field-sizing:content}
.conn-popover .cp-field select{cursor:pointer}
.node-popover{position:fixed;z-index:55;background:linear-gradient(180deg,#151d2f,#111827);border:1px solid rgba(46,156,255,.3);border-radius:10px;min-width:620px;max-width:min(980px,calc(100vw - 20px));max-height:85vh;box-shadow:0 16px 50px rgba(0,0,0,.6);animation:cpop .15s ease}
.node-popover .np-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:grab;border-bottom:1px solid rgba(46,156,255,.15);border-radius:10px 10px 0 0;background:rgba(46,156,255,.04)}
.node-popover .np-head.dragging-pop{cursor:grabbing}
.node-popover .np-title{font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:700}
.node-popover .np-close{width:20px;height:20px;border-radius:4px;border:none;background:rgba(255,255,255,.06);color:var(--muted);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.node-popover .np-body{padding:10px 12px;max-height:calc(85vh - 44px);overflow:auto}
.modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;animation:mf .12s ease}
@keyframes mf{from{opacity:0}to{opacity:1}}@keyframes ms{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal{background:linear-gradient(180deg,#111827,#0d1220);border-radius:14px;width:100%;max-width:580px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;animation:ms .18s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;flex-shrink:0}
.modal-head h2{font-size:12px;font-weight:700}
.modal-close{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:6px;width:24px;height:24px;color:var(--muted);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:11px 15px;overflow-y:auto;flex:1}
.field{margin-bottom:5px}.field label{display:block;font-size:7.5px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.field input,.field select{width:100%;background:rgba(0,0,0,.35);border:1px solid #1c2844;border-radius:5px;padding:5px 7px;color:var(--bright);font-size:10.5px;outline:none;transition:border .2s}
.field input:focus{border-color:rgba(46,156,255,.5)}.field input.mi{font-family:'JetBrains Mono',monospace}
.fr{display:flex;gap:6px;flex-wrap:wrap}.fr .field{flex:1 1 45%;min-width:110px}
.sep{height:1px;background:#1a2540;margin:9px 0}
.sl{font-size:8px;font-family:'JetBrains Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.color-field{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 8px;background:rgba(0,0,0,.2);border-radius:6px;border:1px solid #1a2540}
.color-field label{font-size:7.5px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.color-field input[type=color]{width:32px;height:24px;border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:0;cursor:pointer;background:transparent}
.color-field .color-hex{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--bright);opacity:.6}
.dv-block{background:rgba(0,0,0,.2);border-radius:6px;border:1px solid #1a2540;padding:8px;margin-bottom:5px;border-left:3px solid rgba(100,100,100,.25)}.dv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.dv-name{font-size:8.5px;font-weight:600}.dv-rm{background:rgba(239,83,80,.1);border:1px solid rgba(239,83,80,.2);border-radius:3px;padding:2px 5px;color:var(--red);font-size:6.5px;cursor:pointer}
.add-dv{width:100%;background:rgba(34,214,138,.06);border:1px dashed rgba(34,214,138,.25);border-radius:5px;padding:6px;color:var(--green);font-size:8.5px;cursor:pointer;font-weight:600}
.node-modal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;align-items:start}
.node-modal-main{min-width:0}
.node-modal-side{background:rgba(0,0,0,.2);border:1px solid #1a2540;border-radius:8px;padding:8px;max-height:62vh;overflow:auto}
.ncl-section{margin-top:8px}
.ncl-section:first-of-type{margin-top:0}
.ncl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ncl-title{font-size:8px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ncl-count{font-size:8px;color:var(--muted);background:rgba(255,255,255,.04);border-radius:10px;padding:1px 6px}
.ncl-item{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:5px 6px;margin-bottom:4px}
.ncl-row{display:flex;align-items:center;gap:5px;font-size:9px}
.ncl-peer{font-weight:600}
.ncl-meta{margin-top:3px;font-size:7.5px;color:var(--muted);line-height:1.35}
.ncl-empty{font-size:8px;color:var(--muted);padding:5px 4px;border:1px dashed rgba(255,255,255,.08);border-radius:5px}
@media (max-width:900px){.node-popover{min-width:calc(100vw - 20px)}.node-modal-wrap{grid-template-columns:1fr}.node-modal-side{max-height:none}}
.empty-hint{position:absolute;text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;pointer-events:none}
/* ═══ TOOLPALETTE / FORMEN / AUSWAHL ═══ */
.palette{position:fixed;left:8px;top:calc(var(--hh,46px) + 40px + var(--sb,0px));z-index:60;background:rgba(6,9,15,.86);backdrop-filter:blur(10px);border:1px solid rgba(26,37,64,.55);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:2px}
.pt{width:30px;height:27px;border-radius:6px;border:1px solid transparent;background:rgba(255,255,255,.03);color:var(--text);font-size:13px;font-family:'JetBrains Mono',monospace;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .13s,color .13s,border-color .13s;padding:0}
.pt:hover:not(:disabled){background:rgba(46,156,255,.12);color:var(--accent)}
.pt.active{background:rgba(46,156,255,.18);border-color:rgba(46,156,255,.5);color:var(--accent)}
.pt:disabled{opacity:.2;cursor:default}
.p-sep{height:1px;background:rgba(26,37,64,.8);margin:2px 2px}
.pen-bar{position:fixed;left:46px;top:calc(var(--hh,46px) + 40px + var(--sb,0px));z-index:60;display:none;align-items:center;gap:6px;background:rgba(6,9,15,.88);backdrop-filter:blur(10px);border:1px solid rgba(46,156,255,.35);border-radius:10px;padding:5px 9px}
body.drawing .pen-bar{display:flex}
.pen-bar .pen-lbl{font-size:7.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.pen-bar input[type=color]{width:24px;height:20px;border:1px solid #1c2844;border-radius:4px;background:transparent;padding:1px;cursor:pointer}
.pen-bar input[type=range]{width:74px;accent-color:var(--accent);cursor:pointer;height:16px}
.pen-bar .pen-val{font-size:8px;color:var(--accent);min-width:13px;text-align:right}
/* Bei aktivem Werkzeug gilt der Werkzeugzeiger auf der ganzen Fläche — auch
   über Kacheln, Bereichen und Beschriftungen, die sonst einen Greifzeiger
   hätten. Verschieben mit der mittleren Maustaste geht vor. */
.viewport.placing,.viewport.placing *{cursor:crosshair!important}
.viewport.erasing,.viewport.erasing *{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="8" fill="rgba(239,83,80,.15)" stroke="%23ef5350" stroke-width="2"/></svg>') 11 11,crosshair!important}
.viewport.panning,.viewport.panning *{cursor:grabbing!important}
.sel-band{position:fixed;z-index:70;border:1px dashed var(--accent);background:rgba(46,156,255,.08);pointer-events:none;border-radius:3px}
.shape-node{position:absolute;pointer-events:none;transform-origin:50% 50%}
.shape-node.dragging-node{opacity:.85}
.shape-node.selected{outline:1.5px dashed rgba(46,156,255,.8);outline-offset:3px}
.world svg .sh-hit{pointer-events:visiblePainted;cursor:grab}
.world svg .link-badge{pointer-events:all;cursor:pointer}
.shape-node .sh-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 5px;pointer-events:none;white-space:pre-wrap;word-break:break-word;overflow:hidden;line-height:1.25}
.shape-node .sh-text.txt-main{pointer-events:all;cursor:grab}
.shape-node .sh-text.editing{pointer-events:all;cursor:text;user-select:text;outline:1px solid rgba(46,156,255,.7);background:rgba(6,9,15,.55);overflow:auto}
.sh-h{position:absolute;width:9px;height:9px;background:var(--accent);border:1px solid rgba(6,9,15,.9);border-radius:2px;pointer-events:all;z-index:6}
.sh-res{right:-5px;bottom:-5px;cursor:nwse-resize}
.sh-rot{left:50%;top:-20px;margin-left:-5px;border-radius:50%;background:var(--green);cursor:grab}
.sh-e1{left:-5px;top:50%;margin-top:-5px;border-radius:50%;cursor:move}
.sh-e2{right:-5px;top:50%;margin-top:-5px;border-radius:50%;cursor:move}
.sh-del{position:absolute;right:-9px;top:-9px;width:14px;height:14px;border-radius:3px;border:none;background:rgba(239,83,80,.85);color:#fff;font-size:7px;line-height:1;cursor:pointer;pointer-events:all;display:flex;align-items:center;justify-content:center;padding:0;z-index:6}
.node.selected,.cloud-node.selected{box-shadow:0 0 0 2px rgba(46,156,255,.7),0 6px 24px rgba(0,0,0,.35)}
.group-node.selected{box-shadow:0 0 0 2px rgba(46,156,255,.7)}
.sp-row{display:flex;gap:6px;flex-wrap:wrap}
.sp-row .field{flex:1 1 40%;min-width:88px;margin-bottom:5px}
.conn-popover .field label{display:block;font-size:7.5px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.conn-popover .field input,.conn-popover .field select{width:100%;background:rgba(0,0,0,.35);border:1px solid #1c2844;border-radius:5px;padding:4px 6px;color:var(--bright);font-size:10px;outline:none}
.conn-popover .field input[type=color]{height:24px;padding:1px;cursor:pointer}
.conn-popover .field input[type=range]{padding:0;border:none;background:none;accent-color:var(--accent);height:22px;cursor:pointer}
.sp-check{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--text);cursor:pointer;margin:0 0 5px;flex:1 1 40%}
.sp-check input{width:auto;accent-color:var(--accent);cursor:pointer}
/* ═══ ANIMATION ═══
   Ein Durchlauf entspricht genau einer Musterlänge (--fp), dadurch läuft die
   Schleife nahtlos; die Dauer wird aus Musterlänge/Tempo berechnet, damit
   kurze und lange Verbindungen gleich schnell fließen. */
@keyframes np-flow{from{stroke-dashoffset:var(--fp,20px)}to{stroke-dashoffset:0}}
.flow-path{fill:none;animation:np-flow var(--fdur,.5s) linear infinite}
.sh-anim{animation:np-flow var(--fdur,.5s) linear infinite}
.anim-off #fsvg{display:none}
.anim-off .sh-anim{animation:none}
/* ═══ BESTÄTIGUNGSDIALOG ═══ */
.confirm-overlay{z-index:3000}
.confirm-modal{max-width:400px}
.confirm-modal .modal-head{padding-bottom:2px}
.confirm-modal .modal-head h2{display:flex;align-items:center;gap:6px}
.confirm-modal .modal-body{padding-top:4px}
.cf-msg{font-size:11px;color:var(--bright);line-height:1.55}
.cf-detail{margin-top:8px;padding:7px 9px;background:rgba(0,0,0,.28);border:1px solid #1a2540;border-radius:6px;font-size:9px;color:var(--text);line-height:1.6;max-height:160px;overflow:auto}
.cf-detail .vb{margin-right:4px}
.cf-hint{margin-top:8px;font-size:8px;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.cf-actions{display:flex;gap:6px;padding:4px 15px 14px;justify-content:flex-end}
.cf-btn{padding:7px 15px;font-size:10px}
.cf-btn:focus{outline:2px solid rgba(46,156,255,.65);outline-offset:2px}
/* ═══ SKIZZENMODUS ═══
   Gleiche Daten, andere Darstellung: Kacheln zeigen nur Symbol, Bezeichnung
   und Untertitel; Gruppen werden zu farbigen Zonen mit Titelbalken. Die
   technischen Felder bleiben im Plan erhalten. */
.seg{display:inline-flex;border:1px solid rgba(46,156,255,.28);border-radius:6px;overflow:hidden;flex-shrink:0;align-self:center}
.tb-sep{width:1px;height:14px;background:rgba(26,37,64,.9);margin:0 10px 0 8px;align-self:center;flex-shrink:0}
.seg-b{border:none;background:rgba(46,156,255,.05);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:600;padding:4px 9px;cursor:pointer;transition:all .15s;white-space:nowrap}
.seg-b:hover{color:var(--text)}.seg-b.active{background:rgba(46,156,255,.2);color:var(--accent)}
.sketch .dt-only{display:none!important}
.sk-only{display:none!important}.sketch .sk-only{display:flex!important}
.sk-bar{display:none;position:fixed;top:calc(var(--hh,46px) + 32px);left:0;right:0;z-index:98;background:rgba(6,9,15,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(26,37,64,.35);padding:3px 8px 3px 12px;align-items:center;gap:4px}
/* Symbolspur: blättert über die Pfeilknöpfe oder das Mausrad, ohne sichtbare Scrollleiste */
.sk-track{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.sk-track::-webkit-scrollbar{display:none}
.sk-nav{flex:0 0 auto;width:24px;height:38px;border:1px solid rgba(46,156,255,.28);border-radius:6px;background:rgba(46,156,255,.08);color:var(--accent);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 2px;transition:background .13s,border-color .13s,opacity .13s}
.sk-nav:hover:not(:disabled){background:rgba(46,156,255,.22);border-color:rgba(46,156,255,.55)}
.sk-nav:disabled{opacity:.22;cursor:default}
.sk-bar .skb-up{margin-right:4px}
.sketch .sk-bar{display:flex}.tab-table .sk-bar{display:none}
.sk-search{flex:0 0 auto;width:118px;background:rgba(0,0,0,.35);border:1px solid #1c2844;border-radius:6px;padding:5px 8px;color:var(--bright);font-size:9px;outline:none;margin-right:4px;transition:border-color .15s}
.sk-search:focus{border-color:rgba(46,156,255,.55)}
.sk-search::placeholder{color:var(--muted)}
.sk-search::-webkit-search-cancel-button{cursor:pointer}
.skb[hidden]{display:none}
.sk-none{display:none;font-size:8px;color:var(--muted);padding:0 6px;white-space:nowrap}
.skb{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;width:48px;padding:3px 2px 2px;border:1px solid transparent;border-radius:6px;background:none;color:var(--text);cursor:pointer;transition:all .13s}
.skb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.skb span{font-size:6.3px;font-family:'JetBrains Mono',monospace;white-space:nowrap;color:var(--muted);max-width:46px;overflow:hidden;text-overflow:ellipsis}
.skb:hover{background:rgba(46,156,255,.12);color:var(--accent);border-color:rgba(46,156,255,.3)}.skb:hover span{color:var(--accent)}
.sk-sep{width:1px;height:28px;background:rgba(26,37,64,.9);margin:0 5px;flex:0 0 auto}
.node.sk{width:calc(92px*var(--s,1));padding:calc(7px*var(--s,1)) 4px calc(5px*var(--s,1));text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:9px;transform:translateY(-50%)}
.node.sk .sk-ico{width:calc(40px*var(--s,1));height:calc(40px*var(--s,1));display:flex;align-items:center;justify-content:center}
.node.sk .sk-ico svg{width:calc(40px*var(--s,1));height:calc(40px*var(--s,1));stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.emo{font-size:30px;line-height:1;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.node.sk .emo{font-size:calc(30px*var(--s,1))}
.node.sk .sk-label{font-size:calc(9.5px*var(--s,1));font-weight:700;color:var(--bright);line-height:1.2;white-space:pre-wrap;word-break:break-word;max-width:100%}
.node.sk .sk-cap{font-size:calc(7.5px*var(--s,1));color:var(--text);line-height:1.2;white-space:pre-wrap;word-break:break-word;max-width:100%}
.node.sk .del-chip{position:absolute;right:2px;top:2px;margin:0}
/* Piktogramme sind normale Inline-SVGs — die Ebenen-Regel für .world svg gilt hier nicht */
.world .sk-ico svg,.world .sk-hico svg{position:static;z-index:auto;pointer-events:none;display:block}
/* ✕ in der Skizze erst beim Überfahren der Kachel andeuten, auf dem Knopf selbst voll */
.sketch .del-chip{opacity:0}
.sketch .node:hover .del-chip,.sketch .group-node:hover .del-chip{opacity:.35}
.sketch .node .del-chip:hover,.sketch .group-node .del-chip:hover{opacity:1}
/* Sammellinie rechtwinkliger Verbindungen lässt sich verschieben */
.world svg .conn-hit.ch-h{cursor:ns-resize}.world svg .conn-hit.ch-v{cursor:ew-resize}
.g-head.sk-head{padding:6px 10px;border-radius:9px 9px 0 0;gap:6px}
.sk-head .g-title{font-size:11px;font-family:'DM Sans',system-ui,sans-serif;font-weight:700;letter-spacing:0}
.sk-head .sk-hico{display:flex;align-items:center}.sk-head .sk-hico svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.sk-head .sk-hico .emo{font-size:15px}
.sk-head .sk-hcap{font-size:8px;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sketch .port-label textarea{width:auto;height:auto;min-height:17px;field-sizing:content;min-width:36px;max-width:170px;padding:2px 7px;border-radius:10px;font-family:'DM Sans',system-ui,sans-serif;font-weight:600;font-size:8px;line-height:1.5}
.sketch .port-label textarea:placeholder-shown{opacity:.14}.sketch .port-label:hover textarea{opacity:1}
.sketch .port-label .pl-dot{opacity:0}.sketch .port-label:hover .pl-dot{opacity:.6}
.pk-grid{display:flex;flex-wrap:wrap;gap:3px}
.pk{width:34px;height:34px;border-radius:6px;border:1px solid #1c2844;background:rgba(0,0,0,.25);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-size:13px;transition:all .12s}
.pk svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pk:hover{border-color:var(--accent);color:var(--accent)}.pk.on{border-color:var(--accent);background:rgba(46,156,255,.18);color:var(--accent)}
/* eigene Bilder: behalten ihre Farben, werden nur eingepasst */
.pimg{display:block;object-fit:contain}
.node.sk .sk-ico .pimg{width:calc(40px*var(--s,1));height:calc(40px*var(--s,1))}
.skb .pimg{width:21px;height:21px}
.pk .pimg{width:22px;height:22px}
.sk-head .sk-hico .pimg{width:18px;height:18px}
.pk-up{font-size:15px;color:var(--green);border-color:rgba(34,214,138,.35);background:rgba(34,214,138,.06)}
.pk-up:hover{border-color:var(--green);color:var(--green)}
.pk-w{position:relative;display:inline-flex}
.pk-rm{position:absolute;right:-4px;top:-4px;width:13px;height:13px;border-radius:3px;border:none;background:rgba(239,83,80,.92);color:#fff;font-size:6px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
.pk-w:hover .pk-rm{display:flex}
.pk-info{width:100%;font-size:7.5px;color:var(--muted);margin-top:4px}
.skb-up{color:var(--green)}.skb-up span{color:var(--green)}
.skb-up:hover{border-color:rgba(34,214,138,.4);background:rgba(34,214,138,.12);color:var(--green)}
details.tech summary{cursor:pointer;font-size:8px;font-family:'JetBrains Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:6px 0 4px;list-style:none;display:flex;align-items:center;gap:5px}
details.tech summary::before{content:"▸";font-size:9px}details.tech[open] summary::before{content:"▾"}
/* Papier: heller Hintergrund für Präsentationsgrafiken */
.paper .viewport{background:var(--paper-bg)}
.paper .node{backdrop-filter:none}
.paper .n-detail{color:#3a4a60}
.paper .n-sub{opacity:.95}
.paper .chip{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.24)}
.paper .chip:hover{background:rgba(0,0,0,.08)}
.paper .group-node .g-count{background:rgba(0,0,0,.08);color:#3a4a60}
.paper .node.sk{background:#fff!important;box-shadow:0 1px 3px rgba(20,40,80,.2)}
.paper .node.sk:hover{box-shadow:0 4px 14px rgba(20,40,80,.18)}
.paper .node.sk .sk-label{color:#16222f}.paper .node.sk .sk-cap{color:#3a4a60}
.paper .empty-hint{color:#6f7f96}
.paper .port-label textarea{background:#fff;border:1.5px solid currentColor}
.paper .sh-text.editing{background:rgba(255,255,255,.88)}
.paper .sel-band{background:rgba(46,156,255,.12)}
/* PNG-Export: Bedienelemente ausblenden */
.exporting .del-chip,.exporting .sh-h,.exporting .sh-del,.exporting .pl-rm,.exporting .g-res,.exporting #lsvg,.exporting .empty-hint{display:none!important}
.exporting .port-label textarea:placeholder-shown{opacity:0!important}
.exporting .port-label .pl-dot{opacity:0!important}
.exporting .node,.exporting .cloud-node,.exporting .group-node{box-shadow:none!important}
</style>
</head>

<div class="header">
  <div><h1 class="mono"><em>⬡</em> NETZWERKPLAN</h1></div>
  <div class="toolbar">
    <button class="btn btn-o dt-only" onclick="addNode('firewall')">+ ⛊ Firewall</button>
    <button class="btn btn-a dt-only" onclick="addNode('router')">+ ⬡ Router</button>
    <button class="btn btn-t dt-only" onclick="addNode('switch')">+ ⬢ Switch</button>
    <button class="btn btn-g dt-only" onclick="addNode('device')">+ 🖥 Gerät</button>
    <button class="btn btn-t dt-only" onclick="addNode('internet')">+ ☁ Internet</button>
    <button class="btn btn-g dt-only" onclick="addNode('vlan')">+ ◉ VLAN</button>
    <button class="btn btn-a" id="btnGroup" onclick="addNode('group')">+ ▢ Gruppe</button>
    <button class="btn btn-g" onclick="openAddConn()">+ Verbindung</button>
    <button class="btn btn-a btn-ico" id="btnUndo" onclick="undo()" title="Rückgängig (Strg+Z)" disabled>↶</button>
    <button class="btn btn-a btn-ico" id="btnRedo" onclick="redo()" title="Wiederholen (Strg+Y)" disabled>↷</button>
    <button class="btn btn-r" onclick="startNewPlan()">↺ Neu</button>
    <button class="btn btn-o" id="impBtn" onclick="doImport()">↑ Import</button>
    <button class="btn btn-a" onclick="doExport()">↓ Export</button>
    <button class="btn btn-t" id="pngBtn" onclick="exportPNG()" title="Plan als PNG-Bild speichern">🖼 PNG</button>
    <input type="file" id="fileIn" accept=".json" style="display:none" onchange="handleImport(event)">
    <input type="file" id="imgIn" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event)">
  </div>
</div>
<div class="tab-bar"><button class="tab-btn active" data-tab="topo" onclick="switchTab('topo')">⬡ Topologie</button><button class="tab-btn" data-tab="table" onclick="switchTab('table')">☰ Übersicht</button><div class="tb-sep"></div><div class="seg" title="Darstellung des Plans"><button class="seg-b active" id="modeDetail" onclick="setMode('detail')" title="Technischer Plan mit IPs, VLANs und Ports">⬡ Detail</button><button class="seg-b" id="modeSketch" onclick="setMode('sketch')" title="Vereinfachte Skizze mit Symbolen und Bezeichnungen">✎ Skizze</button></div><div class="zoom-bar" id="zoomBar"><label class="mono" id="tileLbl">Kacheln</label><input type="range" id="tileSlider" min="50" max="200" step="1" value="100" oninput="setTileScale(+this.value/100)" ondblclick="setTileScale(1)" title="Kachelgröße 50 bis 200 % · gilt für die markierten Kacheln, ohne Auswahl für alle · Doppelklick setzt auf 100 %"><span class="zoom-val mono" id="tileVal" style="margin-right:10px">100%</span><button class="btn btn-a" id="btnPaper" onclick="togglePaper()" style="margin-right:8px">☾ Dunkel</button><label class="mono">Zoom</label><input type="range" id="zoomSlider" min="40" max="250" value="100" oninput="setZoom(+this.value)"><span class="zoom-val mono" id="zoomVal">100%</span></div></div>
<div class="sk-bar" id="skBar">
  <button class="skb skb-up" title="Eigenes Bild als Symbol hochladen (PNG, JPG, SVG, WebP)" onclick="pickImage()"><svg viewBox="0 0 48 48"><rect x="5" y="9" width="38" height="30" rx="3"/><path d="M24 18v12M18 24h12"/></svg><span>Bild …</span></button>
  <input type="search" id="skSearch" class="sk-search mono" placeholder="Symbol suchen…" autocomplete="off" spellcheck="false" oninput="filterSkBar(this.value)" onkeydown="skSearchKey(event)" title="Beim Tippen werden die Symbole gefiltert · Enter fügt den ersten Treffer ein · Esc leert">
  <button class="sk-nav" id="skPrev" onclick="skScroll(-1)" title="Weitere Symbole links" disabled>‹</button>
  <div class="sk-track" id="skTrack"></div>
  <button class="sk-nav" id="skNext" onclick="skScroll(1)" title="Weitere Symbole rechts">›</button>
</div>
<div class="tab-content active" id="tab-topo"><div class="viewport" id="viewport"><div class="world" id="world"><svg id="svg" width="3000" height="3000" style="width:3000px;height:3000px"></svg><svg id="fsvg" width="3000" height="3000" style="width:3000px;height:3000px;z-index:2"></svg><svg id="lsvg" width="3000" height="3000" style="width:3000px;height:3000px;z-index:4"></svg><svg id="gsvg" width="3000" height="3000" style="width:3000px;height:3000px;z-index:9"></svg></div></div>
  <div class="palette" id="palette">
    <button class="pt active" data-tool="" onclick="setTool('')" title="Auswahl · Shift+Klick markiert mehrere · Shift+Ziehen = Rahmen">↖</button>
    <div class="p-sep"></div>
    <button class="pt" data-tool="rect" onclick="setTool('rect')" title="Rechteck">▭</button>
    <button class="pt" data-tool="ellipse" onclick="setTool('ellipse')" title="Kreis / Ellipse">◯</button>
    <button class="pt" data-tool="triangle" onclick="setTool('triangle')" title="Dreieck">△</button>
    <button class="pt" data-tool="diamond" onclick="setTool('diamond')" title="Raute">◇</button>
    <button class="pt" data-tool="hexagon" onclick="setTool('hexagon')" title="Sechseck">⬡</button>
    <button class="pt" data-tool="line" onclick="setTool('line')" title="Linie">╱</button>
    <button class="pt" data-tool="arrow" onclick="setTool('arrow')" title="Pfeil">→</button>
    <button class="pt" data-tool="darrow" onclick="setTool('darrow')" title="Doppelpfeil">↔</button>

    <button class="pt" data-tool="erase" onclick="setTool('erase')" title="Radiergummi: über gezeichnete Striche und Formen ziehen · Kacheln und Bereiche bleiben · mittlere Maustaste verschiebt · Esc beendet">⌫</button>
    <button class="pt" data-tool="text" onclick="setTool('text')" title="Text">T</button>
    <div class="p-sep"></div>
    <button class="pt" id="btnLink" onclick="linkSelection()" title="Markierte verknüpfen (Strg+L)" disabled>🔗</button>
    <button class="pt" id="btnUnlink" onclick="unlinkSelection()" title="Verknüpfung lösen (Strg+Shift+L)" disabled>⛓</button>
    <button class="pt" id="btnDup" onclick="duplicateSelection()" title="Formen duplizieren (Strg+D)" disabled>⧉</button>
    <button class="pt" id="btnDel" onclick="deleteSelection()" title="Markierte löschen (Entf)" disabled>🗑</button>
    <div class="p-sep"></div>
    <button class="pt" id="btnAnim" onclick="toggleAnim()" title="Animationen an/aus">✨</button>
    <button class="pt" id="btnGuides" onclick="toggleGuides()" title="Hilfslinien: beim Verschieben an Mitte und Höhe anderer Objekte einrasten (Alt gedrückt = vorübergehend aus)">⌗</button>
    <button class="pt" id="btnPorts" onclick="togglePorts()" title="Beschriftungen an Verbindungen ein- oder ausblenden">🏷</button>

  </div>
  <div class="pen-bar" id="penBar">

  </div>
</div>

<script>
/* ═══ STATE ═══ */
let nodes=[],conns=[],shapes=[];
let nxId=0,zoom=1,panX=0,panY=0,activeTab="topo",highlightedConn=null,highlightedNode=null;
let dragCtx=null;
let dragWp=null;

    if(n.type==="group")grpMembers(n).forEach(m=>out.set(m.id,m));else out.set(n.id,n)});

function gRect(n){const w=gW(n),h=gH(n);return{x1:n.x-w/2,y1:n.y-h/2,x2:n.x+w/2,y2:n.y+h/2,w,h}}

function groupOf(id){return nodes.find(n=>n.type==="group"&&(n.config?.members||[]).includes(id))||null}
function groupAtPoint(x,y,skipId){
  let hit=null;
  nodes.forEach(n=>{if(n.type!=="group"||n.id===skipId)return;const r=gRect(n);if(x>=r.x1&&x<=r.x2&&y>=r.y1&&y<=r.y2&&(!hit||r.w*r.h<gRect(hit).w*gRect(hit).h))hit=n});
  return hit;
}
function nodeEl(id){return document.querySelector(`.node[data-nid="${id}"],.cloud-node[data-nid="${id}"],.group-node[data-nid="${id}"]`)}
function positionNodeEl(n,el){
  if(n.type==="group"){const r=gRect(n);el.style.left=r.x1+"px";el.style.top=r.y1+"px"}
  else if(el.classList.contains("cloud-node")){const w=parseFloat(el.style.width)||144,h=w*58/144;el.style.left=(n.x-w/2)+"px";el.style.top=(n.y-h/2)+"px"}
  else{const w=parseFloat(el.style.width)||170;el.style.left=(n.x-w/2)+"px";el.style.top=n.y+"px"}
}
function addGroupMember(gid,nid,quiet){
  const g=nById(gid),n=nById(nid);if(!g||!n||n.type==="group"||g.id===nid)return;
  const cur=groupOf(nid);if(cur&&cur.id!==gid)rmGroupMember(cur.id,nid,true);
  if(!Array.isArray(g.config.members))g.config.members=[];
  if(!g.config.members.includes(nid))g.config.members.push(nid);
  const r=gRect(g),outside=n.x<r.x1||n.x>r.x2||n.y<r.y1||n.y>r.y2;
  const cw=isSketch()?90:150,chh=isSketch()?80:52;
  const clash=grpMembers(g).some(m=>m.id!==nid&&Math.abs(m.x-n.x)<cw&&Math.abs(m.y-n.y)<chh);
  if(outside||clash)placeInGroup(g,n);
  clampIntoGroup(g,n);
  if(!quiet){renderGrpList(gid);render()}
}
function rmGroupMember(gid,nid,quiet){
  const g=nById(gid);if(!g?.config?.members)return;
  g.config.members=g.config.members.filter(m=>m!==nid);
  if(!quiet){renderGrpList(gid);render()}
}
function nodeSize(n){const el=nodeEl(n.id);if(el?.offsetWidth)return{w:el.offsetWidth,h:el.offsetHeight};const s=nodeScale(n);if(isSketch())return{w:92*s,h:84*s};return n.type==="internet"?{w:144*s,h:58*s}:{w:170*s,h:62*s}}
/* Kachel vollständig in den Rahmen holen (Titelzeile oben freilassen) */
function clampIntoGroup(g,n){
  const r=gRect(g),s=nodeSize(n),pad=8,top=isSketch()?34:26;
  const x1=r.x1+pad+s.w/2,x2=r.x2-pad-s.w/2,y1=r.y1+top+s.h/2,y2=r.y2-pad-s.h/2;
  n.x=x1>x2?(r.x1+r.x2)/2:Math.max(x1,Math.min(x2,n.x));
  n.y=y1>y2?(r.y1+r.y2)/2+top/2:Math.max(y1,Math.min(y2,n.y));
}
/* freien Platz im Rahmen suchen, Gruppe bei Bedarf nach unten wachsen lassen */
function placeInGroup(g,n){
  const sk=isSketch(),r=gRect(g),cols=Math.max(1,Math.floor((r.w-16)/(sk?104:180))),colW=(r.w-16)/cols,rowH=sk?96:64,top=sk?38:30;
  const others=grpMembers(g).filter(m=>m.id!==n.id);
  for(let row=0;row<60;row++)for(let c=0;c<cols;c++){
    const cx=r.x1+8+colW*(c+.5),cy=r.y1+top+rowH*(row+.5);
    if(others.some(m=>Math.abs(m.x-cx)<colW*.5&&Math.abs(m.y-cy)<rowH*.85))continue;
    n.x=cx;n.y=cy;
    const need=cy+rowH/2+8-r.y1;if(need>r.h){g.h=need;g.y=r.y1+need/2}
    return;
  }
}

/* ═══ AUSWAHL & VERKNÜPFUNG (PARENTING) ═══
   Kacheln und Formen sind gleichwertige Objekte. Mit Shift+Klick (oder
   Shift+Rahmen) markiert, mit Strg+L verknüpft: alle Objekte einer Verknüpfung
   tragen dieselbe link-ID und werden zusammen verschoben. */
function allObjs(){return nodes.concat(shapes)}
function sById(id){return shapes.find(s=>s.id===id)||null}
function objById(id){return nById(id)||sById(id)}
function objEl(id){return document.querySelector(`.node[data-nid="${id}"],.cloud-node[data-nid="${id}"],.group-node[data-nid="${id}"],.shape-node[data-sid="${id}"]`)}
function linkMembers(lid){return lid?allObjs().filter(o=>o.link===lid):[]}
function cleanupLinks(){const c={};allObjs().forEach(o=>{if(o.link)c[o.link]=(c[o.link]||0)+1});allObjs().forEach(o=>{if(o.link&&c[o.link]<2)o.link=null})}
function positionObjEl(o,el){if(el.classList.contains("shape-node")){el.style.left=o.x+"px";el.style.top=o.y+"px"}else positionNodeEl(o,el)}
function setTool(t){activeTool=t;document.querySelectorAll(".pt[data-tool]").forEach(b=>b.classList.toggle("active",(b.dataset.tool||"")===t));vp.classList.toggle("placing",!!t&&t!=="erase");vp.classList.toggle("erasing",t==="erase");document.body.classList.toggle("drawing",t==="draw")}
function clearSel(){if(!selection.size)return;selection.clear();syncSel()}
function toggleSel(id){selection.has(id)?selection.delete(id):selection.add(id);syncSel()}
function selectOnly(id){selection.clear();if(id)selection.add(id);syncSel()}
function selectAll(){selection.clear();allObjs().forEach(o=>selection.add(o.id));syncSel()}
function syncSel(){
  renderShapes();
  document.querySelectorAll(".node,.cloud-node,.group-node").forEach(el=>el.classList.toggle("selected",selection.has(el.dataset.nid)));
  renderLinkOverlay();
  const n=selection.size,linked=[...selection].some(id=>objById(id)?.link),shp=[...selection].some(id=>sById(id));
  const b=id=>document.getElementById(id);
  if(b("btnLink"))b("btnLink").disabled=n<2;
  if(b("btnUnlink"))b("btnUnlink").disabled=!linked;
  if(b("btnDup"))b("btnDup").disabled=!shp;
  if(b("btnDel"))b("btnDel").disabled=!n;
  applyTileUI();
  }
function linkSelection(){
  const ids=[...selection];if(ids.length<2)return;
  const lid="l_"+(++nxId),old=new Set(ids.map(i=>objById(i)?.link).filter(Boolean));
  allObjs().forEach(o=>{if(selection.has(o.id)||(o.link&&old.has(o.link)))o.link=lid});
  render();
}
function unlinkSelection(){
  let hit=false;
  selection.forEach(id=>{const o=objById(id);if(o?.link){o.link=null;hit=true}});
  if(!hit)return;cleanupLinks();render();
}
function dissolveLink(lid){linkMembers(lid).forEach(o=>o.link=null);render()}
function selectLink(lid){selection.clear();linkMembers(lid).forEach(m=>selection.add(m.id));syncSel()}
/* Alle Objekte, die mit id zusammen bewegt werden: Verknüpfungen + Gruppeninhalte */
function moveClosure(ids){
  const out=new Set(),st=[...ids];
  while(st.length){
    const id=st.pop();if(out.has(id))continue;out.add(id);
    const o=objById(id);if(!o)continue;
    if(o.link)linkMembers(o.link).forEach(m=>{if(!out.has(m.id))st.push(m.id)});
    if(o.type==="group")(o.config?.members||[]).forEach(m=>{if(!out.has(m))st.push(m)});
  }
  return[...out];
}
function startBand(e){
  const sx=e.clientX,sy=e.clientY;let cx=sx,cy=sy;
  const band=document.createElement("div");band.className="sel-band";document.body.appendChild(band);
  function mv(ev){cx=ev.clientX;cy=ev.clientY;band.style.left=Math.min(sx,cx)+"px";band.style.top=Math.min(sy,cy)+"px";band.style.width=Math.abs(cx-sx)+"px";band.style.height=Math.abs(cy-sy)+"px"}
  function up(){
    document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);band.remove();
    const r=vp.getBoundingClientRect();
    const x1=(Math.min(sx,cx)-r.left-panX)/zoom,x2=(Math.max(sx,cx)-r.left-panX)/zoom;
    const y1=(Math.min(sy,cy)-r.top-panY)/zoom,y2=(Math.max(sy,cy)-r.top-panY)/zoom;
    if(x2-x1>4&&y2-y1>4)allObjs().forEach(o=>{if(o.x>=x1&&o.x<=x2&&o.y>=y1&&o.y<=y2)selection.add(o.id)});
    syncSel();
  }
  document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
}

/* ═══ DRAG (Kacheln + Formen) ═══ */
function startDrag(e,id,el){
  clearTimeout(shapeClickTimer);
  if(e.button!==0||e.target.closest(".del-chip,.g-res,.sh-h,.sh-del"))return;
  e.preventDefault();e.stopPropagation();
  const o=objById(id);if(!o)return;
  if(e.shiftKey){toggleSel(id);return}
  if(!selection.has(id))selectOnly(id);
  const base=selection.size>1?[...selection]:[id];
  const ids=moveClosure(base);
  dragCtx={primary:id,solo:ids.length===1,moved:false,sx:e.clientX,sy:e.clientY,
    items:ids.map(i=>{const ob=objById(i);return{o:ob,ox:ob.x,oy:ob.y}}).filter(it=>it.o)};
  dragCtx.items.forEach(it=>{it.el=objEl(it.o.id);if(it.el)it.el.classList.add("dragging-node")});
  closePopover();
}
function handleDrag(e){
  if(!dragCtx)return;
  let dx=(e.clientX-dragCtx.sx)/zoom,dy=(e.clientY-dragCtx.sy)/zoom;
  if(Math.abs(dx)>3||Math.abs(dy)>3)dragCtx.moved=true;
  /* Hilfslinien: Mitte des gezogenen Objekts an Mitten der übrigen einrasten */
  let guides=[];
  const prim=dragCtx.items.find(it=>it.o.id===dragCtx.primary);
  if(guidesOn&&!e.altKey&&dragCtx.moved&&prim){
    const moving=new Set(dragCtx.items.map(it=>it.o.id)),tol=7/zoom,px=prim.ox+dx,py=prim.oy+dy;
    let bx=null,by=null;
    allObjs().forEach(o=>{
      if(moving.has(o.id))return;
      const ddx=Math.abs(o.x-px),ddy=Math.abs(o.y-py);
      if(ddx<tol&&(!bx||ddx<bx.d))bx={d:ddx,v:o.x};
      if(ddy<tol&&(!by||ddy<by.d))by={d:ddy,v:o.y};
    });
    if(bx){dx+=bx.v-px;guides.push({axis:"x",v:bx.v})}
    if(by){dy+=by.v-py;guides.push({axis:"y",v:by.v})}
  }
  dragCtx.items.forEach(it=>{it.o.x=it.ox+dx;it.o.y=it.oy+dy;const el=it.el&&it.el.isConnected?it.el:objEl(it.o.id);if(el)positionObjEl(it.o,el)});
  renderGuides(guides,prim?prim.o:null);
  const p=objById(dragCtx.primary);
  if(dragCtx.solo&&p&&nById(dragCtx.primary)&&p.type!=="group"){
    const g=groupAtPoint(p.x,p.y,p.id);
    document.querySelectorAll(".group-node.drop-target").forEach(el=>{if(!g||el.dataset.nid!==g.id)el.classList.remove("drop-target")});
    if(g){const ge=nodeEl(g.id);if(ge)ge.classList.add("drop-target")}
  }
  renderSVG();renderPL();renderLinkOverlay();
}
function endDrag(e){
  if(!dragCtx)return;
  const ctx=dragCtx;dragCtx=null;
  renderGuides([]);
  ctx.items.forEach(it=>{const el=it.el&&it.el.isConnected?it.el:objEl(it.o.id);if(el)el.classList.remove("dragging-node")});
  document.querySelectorAll(".group-node.drop-target").forEach(el=>el.classList.remove("drop-target"));
  if(!ctx.moved){
    if(sById(ctx.primary)){
      /* Doppelklick selbst erkennen: das Formelement wird bei Auswahländerung neu
         aufgebaut, ein natives dblclick käme dann nicht mehr an */
      const now=Date.now(),sid=ctx.primary,cx=e.clientX,cy=e.clientY;
      clearTimeout(shapeClickTimer);
      if(lastShapeClick.id===sid&&now-lastShapeClick.t<450){lastShapeClick={id:null,t:0};beginTextEdit(sid);return}
      lastShapeClick={id:sid,t:now};
      shapeClickTimer=setTimeout(()=>openShapePopover(sid,cx,cy),250);
    }
    else openNodeModal(ctx.primary,e.clientX,e.clientY);
    return;
  }
  const p=objById(ctx.primary);
  if(ctx.solo&&p&&nById(ctx.primary)&&p.type!=="group"){
    const tgt=groupAtPoint(p.x,p.y,p.id),cur=groupOf(p.id);
    if(tgt!==cur){if(cur)rmGroupMember(cur.id,p.id,true);if(tgt)addGroupMember(tgt.id,p.id,true)}
  }
  render();
}
/* ═══ HILFSLINIEN ═══
   Ansichtseinstellung wie die Animationen. Während des Ziehens zeigt eine
   gestrichelte Linie, an welchen Objekten die Kachel gerade ausgerichtet ist;
   kleine Kreise markieren deren Mitten. */
const GUIDES_KEY="netzwerkplan.guides.v1";
let guidesOn=(function(){try{return localStorage.getItem(GUIDES_KEY)!=="0"}catch(_err){return true}})();
function applyGuidesBtn(){const b=document.getElementById("btnGuides");if(b){b.classList.toggle("active",guidesOn);b.title=(guidesOn?"Hilfslinien aus":"Hilfslinien an")+" · beim Verschieben an Mitte und Höhe anderer Objekte einrasten (Alt gedrückt = vorübergehend aus)"}}
function toggleGuides(){guidesOn=!guidesOn;try{localStorage.setItem(GUIDES_KEY,guidesOn?"1":"0")}catch(_err){}applyGuidesBtn();if(!guidesOn)renderGuides([])}
function renderGuides(guides,primary){
  const svg=document.getElementById("gsvg");if(!svg)return;
  if(!guides.length||!primary){svg.innerHTML="";return}
  const moving=new Set(dragCtx?dragCtx.items.map(it=>it.o.id):[]),col=isPaper()?"#e0269a":"#ff4fb0";
  let h="";
  guides.forEach(g=>{
    const hits=allObjs().filter(o=>!moving.has(o.id)&&Math.abs((g.axis==="x"?o.x:o.y)-g.v)<.5);
    if(g.axis==="x"){
      const ys=hits.map(o=>o.y).concat([primary.y]),y1=Math.min(...ys)-34,y2=Math.max(...ys)+34;
      h+=`<line x1="${g.v}" y1="${y1}" x2="${g.v}" y2="${y2}" stroke="${col}" stroke-width="1" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`;
      ys.forEach(y=>h+=`<circle cx="${g.v}" cy="${y}" r="3.5" fill="none" stroke="${col}" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`);
    }else{
      const xs=hits.map(o=>o.x).concat([primary.x]),x1=Math.min(...xs)-34,x2=Math.max(...xs)+34;
      h+=`<line x1="${x1}" y1="${g.v}" x2="${x2}" y2="${g.v}" stroke="${col}" stroke-width="1" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`;
      xs.forEach(x=>h+=`<circle cx="${x}" cy="${g.v}" r="3.5" fill="none" stroke="${col}" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`);
    }
  });
  svg.innerHTML=h;
}
/* ═══ BEREICH AUFRÄUMEN ═══
   Zwei Varianten, beide ordnen die Kacheln in ein Raster:
   „Bereich anpassen“ lässt die Kacheln wie sie sind und bringt den Rahmen auf
   die nötige Größe. „Kacheln anpassen“ lässt den Rahmen wie er ist und
   skaliert die Kacheln so, dass sie ihn ausfüllen.
   Die bisherige Anordnung bleibt jeweils erhalten: aus den Y-Werten werden
   Zeilen gebildet, innerhalb der Zeile wird nach X sortiert. */
function tidyGaps(){return{GX:18,GY:isSketch()?16:14,PX:14,PB:14,TOP:isSketch()?34:26}}
function tidySizes(ms){return new Map(ms.map(m=>[m.id,nodeSize(m)]))}
function tidyOrder(ms,sz){
  const tol=Math.max(...ms.map(m=>sz.get(m.id).h))*.6,rows=[];
  [...ms].sort((a,b)=>a.y-b.y).forEach(m=>{const r=rows[rows.length-1];if(r&&Math.abs(m.y-r.y0)<=tol)r.items.push(m);else rows.push({y0:m.y,items:[m]})});
  return rows.flatMap(r=>r.items.sort((a,b)=>a.x-b.x));
}
/* Maße des Rasters für eine bestimmte Spaltenzahl */
function tidyGrid(order,sz,cols){
  const{GX,GY}=tidyGaps(),rows=[];
  for(let i=0;i<order.length;i+=cols)rows.push(order.slice(i,i+cols));
  const cellW=Math.max(...order.map(m=>sz.get(m.id).w));
  const rowH=rows.map(r=>Math.max(...r.map(m=>sz.get(m.id).h)));
  return{rows,cellW,rowH,w:cols*cellW+(cols-1)*GX,h:rowH.reduce((a,b)=>a+b,0)+GY*(rows.length-1)};
}
/* Kacheln im Rahmen ablegen: Zeilen mittig, bei Bedarf auch senkrecht mittig */
function tidyPlace(g,grid,vcenter){
  const{GX,GY,PX,PB,TOP}=tidyGaps(),r=gRect(g);
  let y=r.y1+TOP;
  if(vcenter){const free=(r.h-TOP-PB)-grid.h;if(free>0)y+=free/2}
  grid.rows.forEach((row,ri)=>{
    const rowW=row.length*grid.cellW+(row.length-1)*GX;
    let x=r.x1+(r.w-rowW)/2;
    row.forEach(m=>{m.x=Math.round(x+grid.cellW/2);m.y=Math.round(y+grid.rowH[ri]/2);x+=grid.cellW+GX});
    y+=grid.rowH[ri]+GY;
  });
}
/* Variante 1: Rahmen an die Kacheln anpassen */
function tidyFrame(g){
  const ms=grpMembers(g);if(!ms.length)return false;
  const sz=tidySizes(ms),order=tidyOrder(ms,sz),{GX,PX,PB,TOP}=tidyGaps(),r0=gRect(g);
  const cellW=Math.max(...ms.map(m=>sz.get(m.id).w));
  const cols=Math.max(1,Math.min(order.length,Math.floor((r0.w-2*PX+GX)/(cellW+GX))));
  const grid=tidyGrid(order,sz,cols);
  const x1=r0.x1,y1=r0.y1;
  g.w=Math.max(140,r0.w,grid.w+2*PX);g.h=Math.max(80,TOP+grid.h+PB);
  g.x=x1+g.w/2;g.y=y1+g.h/2;
  tidyPlace(g,grid,false);
  return true;
}
/* Variante 2: Kacheln an den Rahmen anpassen.
   Der Faktor wirkt auf die bisherige Größe jeder Kachel, absichtlich größer
   gestellte Kacheln bleiben also im Verhältnis größer. Weil sich Höhen durch
   Textumbruch nicht exakt linear verhalten, wird nachgemessen und korrigiert. */
function tidyTiles(g){
  const ms=grpMembers(g);if(!ms.length)return false;
  let sz=tidySizes(ms);
  const order=tidyOrder(ms,sz),{GX,GY,PX,PB,TOP}=tidyGaps(),r=gRect(g);
  const W=Math.max(20,r.w-2*PX),H=Math.max(20,r.h-TOP-PB);
  let best=null;
  for(let c=1;c<=order.length;c++){
    const gr=tidyGrid(order,sz,c);
    const k=Math.min((W-(c-1)*GX)/(gr.w-(c-1)*GX),(H-(gr.rows.length-1)*GY)/(gr.h-(gr.rows.length-1)*GY));
    if(k>0&&(!best||k>best.k+1e-6))best={k,cols:c};
  }
  if(!best)return false;
  const base=new Map(order.map(m=>[m.id,nodeScale(m)]));
  let k=best.k,grid=null;
  for(let pass=0;pass<3;pass++){
    order.forEach(m=>{m.scale=Math.round(clampScale(base.get(m.id)*k)*1000)/1000});
    renderNodes();
    sz=tidySizes(order);
    grid=tidyGrid(order,sz,best.cols);
    if(grid.w<=W+.5&&grid.h<=H+.5)break;
    k*=Math.min(W/Math.max(1,grid.w),H/Math.max(1,grid.h))*.995;
  }
  /* Reicht die kleinste erlaubte Kachelgröße nicht aus, wächst der Rahmen so
     weit mit, dass nichts abgeschnitten wird */
  if(grid.w>W+.5||grid.h>H+.5){
    const r0=gRect(g),x1=r0.x1,y1=r0.y1;
    g.w=Math.max(g.w,grid.w+2*PX);g.h=Math.max(g.h,TOP+grid.h+PB);
    g.x=x1+g.w/2;g.y=y1+g.h/2;
  }
  tidyPlace(g,grid,true);
  return true;
}
function tidyTargets(){
  const set=new Map();
  selection.forEach(id=>{const o=nById(id);if(!o)return;if(o.type==="group")set.set(o.id,o);else{const g=groupOf(o.id);if(g)set.set(g.id,g)}});
  const sel=[...set.values()];
  return sel.length?sel:nodes.filter(n=>n.type==="group");
}
function autoAdjust(kind){
  const targets=tidyTargets(),term=isSketch()?"Bereich":"Gruppe";
  if(!targets.length){showAlert({title:`Kein${isSketch()?"":"e"} ${term} vorhanden`,icon:"ℹ",ok:"Verstanden",message:`Zum Ausrichten wird ${isSketch()?"ein Bereich":"eine Gruppe"} gebraucht.`,hint:`Oben „+ ▢ ${term}“ anlegen und Kacheln hineinziehen`});return}
  const fn=kind==="tiles"?tidyTiles:tidyFrame;
  const done=targets.filter(g=>fn(g)).length;
  render();
  if(!done)showAlert({title:"Nichts auszurichten",icon:"ℹ",ok:"Verstanden",message:targets.length===1?`Diese${isSketch()?"r":""} ${term} enthält keine Kacheln.`:"Die betroffenen Rahmen enthalten keine Kacheln.",hint:"Kacheln hineinziehen und erneut aufräumen"});
}
function tidyGroupById(id,kind){
  const g=nById(id);if(g?.type!=="group")return;
  const fn=kind==="tiles"?tidyTiles:tidyFrame;
  if(!fn(g)){showAlert({title:"Nichts auszurichten",icon:"ℹ",ok:"Verstanden",message:"Hier sind noch keine Kacheln enthalten.",hint:"Kacheln hineinziehen oder unten zuordnen"});return}
  render();renderGrpList(id);
}
function startGroupResize(e,id,el){
  e.preventDefault();e.stopPropagation();
  const n=nById(id);if(!n)return;
  const sx=e.clientX,sy=e.clientY,ow=gW(n),oh=gH(n),x1=n.x-ow/2,y1=n.y-oh/2;
  function mv(ev){
    const w=Math.max(140,ow+(ev.clientX-sx)/zoom),h=Math.max(80,oh+(ev.clientY-sy)/zoom);

/* ═══ FORMEN ═══
   Jede Form hat einen Mittelpunkt (x,y), eine Box (w,h) und eine Drehung (rot).
   Linien/Pfeile laufen waagerecht durch die Box und werden über rot gedreht,

function isLineKind(k){return k==="line"||k==="arrow"||k==="darrow"}
/* ═══ FREIHAND ═══
   Der Strich wird als Punktzug im Einheitsquadrat (0..1) gespeichert und beim
   Zeichnen auf die Box der Form abgebildet — so lässt er sich wie jede andere
   Form verschieben, skalieren und drehen. Farbe und Stärke kommen aus der
   Stiftleiste und bleiben als Ansichtseinstellung erhalten. */
const PEN_KEY="netzwerkplan.pen.v1";

(function(){try{const d=JSON.parse(localStorage.getItem(PEN_KEY)||"null");if(d){if(/^#[0-9a-f]{6}$/i.test(d.color||""))penColor=d.color;if(+d.width>0)penWidth=Math.max(1,Math.min(16,+d.width))}}catch(_err){}})();
function applyPenUI(){
  const c=document.getElementById("penColor"),w=document.getElementById("penWidth"),v=document.getElementById("penVal");
  if(c)c.value=penColor;if(w)w.value=penWidth;if(v)v.textContent=penWidth;
}
function setPen(f,v){
  if(f==="color")penColor=v;else penWidth=Math.max(1,Math.min(16,+v||1));
  applyPenUI();
  try{localStorage.setItem(PEN_KEY,JSON.stringify({color:penColor,width:penWidth}))}catch(_err){}
  /* markierte Freihand-Striche gleich mitändern */
  const sel=[...selection].map(sById).filter(s=>s&&s.kind==="draw");
  if(sel.length){sel.forEach(s=>{if(f==="color")s.stroke=penColor;else s.sw=penWidth});render()}
}
/* weiche Linie durch Quadratkurven zwischen den Mittelpunkten */
function smoothD(p){
  if(!p||!p.length)return"";
  const f=n=>n.toFixed(1);
  if(p.length<3)return p.map((q,i)=>(i?"L":"M")+f(q.x)+" "+f(q.y)).join(" ");
  let d="M"+f(p[0].x)+" "+f(p[0].y);
  for(let i=1;i<p.length-1;i++)d+=` Q${f(p[i].x)} ${f(p[i].y)} ${f((p[i].x+p[i+1].x)/2)} ${f((p[i].y+p[i+1].y)/2)}`;
  const l=p[p.length-1];
  return d+` L${f(l.x)} ${f(l.y)}`;
}
function drawPts(s,w,h){return(s.pts||[]).map(p=>({x:p.x*w,y:p.y*h}))}
function startFreehand(e){
  e.preventDefault();e.stopPropagation();

  const pts=[toWorld(e)],svg=document.getElementById("gsvg");

  path.setAttribute("fill","none");path.setAttribute("stroke",penColor);path.setAttribute("stroke-width",penWidth);
  path.setAttribute("stroke-linecap","round");path.setAttribute("stroke-linejoin","round");
  svg.appendChild(path);
  const upd=()=>path.setAttribute("d",smoothD(pts));
  upd();
  const min=2/zoom;
  function mv(ev){const p=toWorld(ev),l=pts[pts.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)<min)return;pts.push(p);upd()}
  function up(){

    path.remove();finishFreehand(pts);
  }
  document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
}
/* ═══ RADIERGUMMI ═══
   Was unter dem Zeiger tatsächlich gezeichnet ist, wird entfernt — geprüft
   über die sichtbare Trefferfläche, nicht über das umgebende Rechteck. Kacheln
   und Bereiche bleiben unangetastet. */

/* Mit aktivem Stift löscht ein Rechtsklick den getroffenen Freihand-Strich */
vp.addEventListener("contextmenu",e=>{

function finishFreehand(pts){

  s.pts=pts.map(p=>({x:+((p.x-x1)/w).toFixed(4),y:+((p.y-y1)/h).toFixed(4)}));

function mkShape(kind,x,y,w,h,rot){
  const d=SH[kind]||SH.rect,line=isLineKind(kind),txt=kind==="text",pp=isPaper();

function shapeGeom(s){

  let b="";
  if(s.kind==="text"){
    b=`<rect class="sh-hit" x="0" y="0" width="${w}" height="${h}" fill="transparent" stroke="none"/>`;
  }else if(s.kind==="draw"){
    const d=smoothD(drawPts(s,w,h));
    b+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"${dash}${anim}/>`;
    b+=`<path class="sh-hit" d="${d}" fill="none" stroke="transparent" stroke-width="${Math.max(14,sw+10)}" stroke-linecap="round"/>`;

    if(s.kind!=="line")b+=`<polygon points="${w},${y} ${w-hd*1.25},${y-hd*.68} ${w-hd*1.25},${y+hd*.68}" fill="${col}"/>`;
    if(s.kind==="darrow")b+=`<polygon points="0,${y} ${hd*1.25},${y-hd*.68} ${hd*1.25},${y+hd*.68}" fill="${col}"/>`;
    b+=`<line class="sh-hit" x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="transparent" stroke-width="16" fill="none"/>`;
  }else{

    b+=`${g.replace(/^(<[a-z]+)/,'$1 class="sh-hit"')} fill="${filled?"transparent":"none"}" stroke="transparent" stroke-width="16"/>`;

function renderShapes(){

function refreshShapeEl(s){

function lineEnds(s){const a=(s.rot||0)*Math.PI/180,hx=Math.cos(a)*s.w/2,hy=Math.sin(a)*s.w/2;return{ax:s.x-hx,ay:s.y-hy,bx:s.x+hx,by:s.y+hy}}

/* ═══ VERKNÜPFUNGS-OVERLAY ═══ */
function objBBox(o){

function renderLinkOverlay(){

  });

/* ═══ VIA: node refs {id:"n_3"} + free points {x,y} ═══ */

function handleWpDrag(e){if(!dragWp)return;dragWp.c.via[dragWp.wi].x=dragWp.ox+(e.clientX-dragWp.sx)/zoom;dragWp.c.via[dragWp.wi].y=dragWp.oy+(e.clientY-dragWp.sy)/zoom;renderSVG();renderPL()}
function addWaypoint(cid,segIdx,e){const c=conns.find(cn=>cn.id===cid);if(!c)return;if(!c.via)c.via=[];const r=vp.getBoundingClientRect();const L=plLine(cid),ins=L?.segIns?.[segIdx]??segIdx;preservePl(c,()=>c.via.splice(ins,0,{x:(e.clientX-r.left-panX)/zoom,y:(e.clientY-r.top-panY)/zoom}));renderSVG();renderPL()}

/* ═══ COMPUTE LINES ═══ */
/* ═══ VERLAUF (ROUTING) ═══
   "direct": gerade Linie. "orthoV"/"orthoH": rechtwinklig mit Sammellinie —
   zwischen zwei Ankerpunkten werden zwei Knickpunkte eingefügt, so dass ein
   kurzer Stich, die Sammellinie und ein zweiter Stich entstehen. c.mid (0..1)
   legt fest, wo die Sammellinie zwischen den Ankern liegt; liegen mehrere
   Anker auf einer Höhe, fallen die Sammellinien zusammen (Bus-Optik). */
function connRoute(c){return c.route==="orthoV"||c.route==="orthoH"?c.route:"direct"}
function connMid(c){const t=+c.mid;return isFinite(t)?Math.max(0,Math.min(1,t)):.5}
function orthoBends(p,q,route,t){
  const dx=q.x-p.x,dy=q.y-p.y;
  if(Math.abs(dx)<.5||Math.abs(dy)<.5)return[];
  if(route==="orthoV"){const my=p.y+dy*t;return[{x:p.x,y:my,ch:"h"},{x:q.x,y:my,ch:"h"}]}
  const mx=p.x+dx*t;return[{x:mx,y:p.y,ch:"v"},{x:mx,y:q.y,ch:"v"}];
}
function computeLines(){
  const SPACING=7,result=[];
  /* build path for each connection */
  const cpaths=[];
  conns.forEach(c=>{
    const fn=nById(c.from),tn=nById(c.to);if(!fn||!tn)return;
    const via=resolveVia(c),route=connRoute(c),t=connMid(c);
    const anchors=[{x:fn.x,y:fn.y,nid:c.from,vi:-1},...via.map((v,i)=>({x:v.x,y:v.y,nid:v.isNode?v.nodeId:null,vi:i})),{x:tn.x,y:tn.y,nid:c.to,vi:-1}];
    const path=[],chans=[];
    anchors.forEach((a,i)=>{
      if(i>0&&route!=="direct"){
        const p=anchors[i-1],b=orthoBends(p,a,route,t);
        if(b.length){path.push({x:b[0].x,y:b[0].y,nid:null,vi:-1});chans.push({seg:path.length-1,p,q:a,ch:b[0].ch});path.push({x:b[1].x,y:b[1].y,nid:null,vi:-1})}
      }
      path.push(a);
    });
    cpaths.push({c,path,chans});
  });
  /* group segments by sorted (startNode, endNode) pair — like private version's spoke groups */
  const spokes=new Map();
  cpaths.forEach((cp,ci)=>{for(let si=0;si<cp.path.length-1;si++){const a=cp.path[si].nid||`wp${ci}_${si}`,b=cp.path[si+1].nid||`wp${ci}_${si+1}`;const key=[a,b].sort().join("|");if(!spokes.has(key))spokes.set(key,[]);spokes.get(key).push({ci,si})}});
  /* per spoke pair: perpendicular from segment direction, centered offsets */
  const segOff=new Map();
  for(const[key,entries] of spokes){
    /* use first entry's direction for consistent perpendicular */
    const e0=entries[0],cp0=cpaths[e0.ci],s0=cp0.path[e0.si],s1=cp0.path[e0.si+1];
    const dx=s1.x-s0.x,dy=s1.y-s0.y,l=Math.sqrt(dx*dx+dy*dy)||1;
    const px=-dy/l,py=dx/l;
    entries.forEach((e,i)=>{const off=(i-(entries.length-1)/2)*SPACING;segOff.set(`${e.ci}-${e.si}`,{ox:px*off,oy:py*off})});
  }
  /* build pts: 2 points per segment (same offset at both ends → true parallel) */
  cpaths.forEach((cp,ci)=>{
    const pts=[];
    for(let si=0;si<cp.path.length-1;si++){const p0=cp.path[si],p1=cp.path[si+1],o=segOff.get(`${ci}-${si}`)||{ox:0,oy:0};pts.push({x:p0.x+o.ox,y:p0.y+o.oy});pts.push({x:p1.x+o.ox,y:p1.y+o.oy})}
    /* viaIdx: Wegpunkt i → Index im Pfad; segIns: Einfügeposition in c.via
       für einen neuen Wegpunkt auf Teilstrecke s */
    const viaIdx=[];cp.path.forEach((p,i)=>{if(p.vi>=0)viaIdx[p.vi]=i});
    const segIns=[];let cnt=0;for(let s=0;s<cp.path.length-1;s++){segIns.push(cnt);if(cp.path[s+1].vi>=0)cnt++}
    result.push({c:cp.c,pts,nSegs:cp.path.length-1,viaIdx,segIns,chans:cp.chans});
  });
  return result;
}
/* Sammellinie ziehen: verschiebt c.mid, rastet an Sammellinien anderer
   Verbindungen ein, damit sich Linien sauber zusammenführen lassen */
let dragCh=null,chMoved=false;
function startChDrag(cid,seg,e){
  if(e.button!==0)return;
  const L=plLine(cid),ch=L?.chans.find(x=>x.seg===seg);if(!ch)return;
  e.preventDefault();e.stopPropagation();
  chMoved=false;dragCh={c:L.c,ch,sx:e.clientX,sy:e.clientY};
}
function handleChDrag(e){
  if(!dragCh)return;
  if(!chMoved&&Math.abs(e.clientX-dragCh.sx)<3&&Math.abs(e.clientY-dragCh.sy)<3)return;
  chMoved=true;
  const r=vp.getBoundingClientRect(),wx=(e.clientX-r.left-panX)/zoom,wy=(e.clientY-r.top-panY)/zoom;
  const {p,q,ch}=dragCh.ch,horiz=ch==="h";
  const a=horiz?p.y:p.x,b=horiz?q.y:q.x;if(Math.abs(b-a)<1)return;
  let v=horiz?wy:wx;
  const tol=7/zoom;
  computeLines().forEach(L=>{if(L.c.id===dragCh.c.id)return;L.chans.forEach(o=>{if(o.ch!==ch)return;const pt=L.pts[o.seg*2],ov=horiz?pt.y:pt.x;if(Math.abs(ov-v)<tol)v=ov})});
  dragCh.c.mid=Math.round(Math.max(0,Math.min(1,(v-a)/(b-a)))*1000)/1000;
  renderSVG();renderPL();
}
function setRoute(cid,route){const c=conns.find(x=>x.id===cid);if(!c)return;preservePl(c,()=>{c.route=route;if(route==="direct")delete c.mid});const pop=document.getElementById("connPop");const px=parseFloat(pop?.style.left||100),py=parseFloat(pop?.style.top||100);render();if(pop)openConnPopover(cid,px,py)}
function applyRouteAll(cid){const src=conns.find(x=>x.id===cid);if(!src)return;const route=connRoute(src);conns.forEach(c=>preservePl(c,()=>{c.route=route;if(route==="direct")delete c.mid}));render()}

/* ═══ VERBINDUNGS-ANIMATION ═══
   Eigene SVG-Ebene: die Pfade werden beim Neuzeichnen nur aktualisiert, nicht
   neu erzeugt — sonst würde die CSS-Animation bei jedem Render neu anlaufen.
   Ein/Aus ist eine Ansichtseinstellung und liegt daher nicht im Plan. */
const ANIM_KEY="netzwerkplan.anim.v1";
const ANIM_MODES={
  dots:{label:"Leuchtpunkte",period:26,dash:"0.1 25.9",w:5,cap:"round",px:55,glow:true},
  dash:{label:"Laufende Striche",period:18,dash:"11 7",w:2.6,cap:"butt",px:42,glow:false}
};
const SH_ANIM_PX=42;
let animOn=(function(){
  try{const v=localStorage.getItem(ANIM_KEY);if(v!==null)return v==="1"}catch(_err){}
  return !(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
})();
/* ohne eigene Angabe fließen Verbindungen als Leuchtpunkte */
function connAnim(c){const m=c.anim===undefined?"dots":c.anim;return ANIM_MODES[m]?m:""}
function connSpeed(c){const s=+c.animSpeed;return s>0?s:1}
/* Pfeilspitzen und Linienstärke: ohne Angabe wie bisher (Pfeil am Ende),
   in der Skizze etwas kräftigere Linien */
function connArrow(c){return c.arrow==="none"||c.arrow==="both"?c.arrow:"end"}
function connWidth(c){const w=+c.width;return w>0?w:(isSketch()?3:2)}
function ptsToPath(pts){return pts.map((p,i)=>(i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ")}
function applyAnim(){
  world.classList.toggle("anim-off",!animOn);
  const b=document.getElementById("btnAnim");
  if(b){b.classList.toggle("active",animOn);b.title=animOn?"Animationen aus":"Animationen an"}
}
function toggleAnim(){animOn=!animOn;try{localStorage.setItem(ANIM_KEY,animOn?"1":"0")}catch(_err){}applyAnim()}
function renderFlow(lines){
  const svg=document.getElementById("fsvg");if(!svg)return;
  const L=lines||computeLines(),seen=new Set(),glowOk=L.length<=40;
  L.forEach(l=>{
    const mode=connAnim(l.c);if(!mode)return;
    const fid="f"+l.c.id;seen.add(fid);
    let p=svg.querySelector(`[data-fid="${fid}"]`);
    if(!p){p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("class","flow-path");p.setAttribute("data-fid",fid);svg.appendChild(p)}
    const M=ANIM_MODES[mode],col=lineInk(l.c.color||"#888");
    p.setAttribute("d",ptsToPath(l.pts));
    p.setAttribute("stroke",col);
    p.setAttribute("stroke-width",M.w);
    p.setAttribute("stroke-linecap",M.cap);
    p.setAttribute("stroke-dasharray",M.dash);
    p.style.setProperty("--fp",M.period+"px");
    p.style.setProperty("--fdur",(M.period/(M.px*connSpeed(l.c))).toFixed(3)+"s");
    p.style.filter=(M.glow&&glowOk)?`drop-shadow(0 0 3px ${col})`:"";
    p.style.opacity=isConnHighlighted(l.c)?"1":".8";
  });
  [...svg.children].forEach(el=>{if(!seen.has(el.dataset.fid))el.remove()});
}

/* ═══ RENDER ═══ */
function render(){renderSVG();renderNodes();syncSel();renderPL();if(activeTab==="table")renderTableView();refreshOpenNodeConnList();scheduleLocalSave()}

function connRouteText(c){
  const via=(c.via||[]).filter(v=>v.id).map(v=>{const vn=nById(v.id);return vn?`${vn.icon} ${vn.label}`:v.id});
  return via.length?via.join(" → "):"";
}
function connItemHtml(c,nodeId,isOutgoing){
  const peerId=isOutgoing?c.to:c.from,peer=nById(peerId);
  const peerTxt=peer?`${peer.icon} ${peer.label}`:peerId;
  const route=connRouteText(c),arrow=isOutgoing?"→":"←";
  return `<div class="ncl-item"><div class="ncl-row"><div class="cd" style="background:${c.color||'#888'}"></div><span class="mono">#${c.id}</span><span style="color:var(--muted)">${arrow}</span><span class="ncl-peer" style="color:${peer?.color||'var(--bright)'}">${escH(peerTxt)}</span></div>${c.port?`<div class="ncl-meta mono">Port(s): ${escH(c.port)}</div>`:""}${route?`<div class="ncl-meta">über ${escH(route)}</div>`:""}</div>`;
}
function renderNodeConnList(nodeId){
  const el=document.getElementById("nodeConnList");
  if(!el)return;
  const inc=conns.filter(c=>c.to===nodeId),out=conns.filter(c=>c.from===nodeId);

  const incHtml=inc.length?inc.map(c=>connItemHtml(c,nodeId,false)).join(""):'<div class="ncl-empty">Keine eingehenden Verbindungen</div>';
  const addBtn=`<button class="btn btn-g" style="width:100%;padding:6px;margin-bottom:8px" onclick="openAddConn('${nodeId}')" title="Neue Verbindung von diesem Knoten anlegen">+ Verbindung hinzufügen</button>`;
  el.innerHTML=`${addBtn}<div class="ncl-section"><div class="ncl-head"><div class="ncl-title mono">Ausgehend</div><div class="ncl-count mono">${out.length}</div></div>${outHtml}</div><div class="ncl-section"><div class="ncl-head"><div class="ncl-title mono">Eingehend</div><div class="ncl-count mono">${inc.length}</div></div>${incHtml}</div>`;
}
function refreshOpenNodeConnList(){
  const openModal=document.querySelector(".node-edit-modal[data-node-id]");
  if(openModal)renderNodeConnList(openModal.dataset.nodeId);
}
function isConnHighlighted(c){return highlightedConn===c.id||(highlightedNode!=null&&(c.from===highlightedNode||c.to===highlightedNode))}

function renderSVG(){
  const svg=document.getElementById("svg");let h='';
  const lines=computeLines();
  const sorted=[...lines].sort((a,b)=>(isConnHighlighted(a.c)?1:0)-(isConnHighlighted(b.c)?1:0));
  const sk=isSketch();
  sorted.forEach(L=>{
    const pp=isPaper(),col=lineInk(L.c.color||"#888"),isHl=isConnHighlighted(L.c),pts=L.pts,bw=connWidth(L.c);
    const sw=isHl?bw+1.5:bw,op=isHl?.95:pp?(sk?1:.9):(sk?.9:.5);
    const dashA=L.c.dash?` stroke-dasharray="${Math.max(6,bw*3)} ${Math.max(4,bw*2.2)}"`:"";
    if(isHl){for(let i=0;i<pts.length-1;i++)h+=`<line x1="${pts[i].x}" y1="${pts[i].y}" x2="${pts[i+1].x}" y2="${pts[i+1].y}" stroke="${col}" stroke-opacity=".2" stroke-width="${bw+7}" stroke-linecap="round"/>`}
    for(let i=0;i<pts.length-1;i++)h+=`<line x1="${pts[i].x}" y1="${pts[i].y}" x2="${pts[i+1].x}" y2="${pts[i+1].y}" stroke="${col}" stroke-opacity="${op}" stroke-width="${sw}" stroke-linecap="round"${dashA}/>`;
    const arrow=connArrow(L.c),asz=Math.max(5,bw*2.2),aop=isHl?.95:pp?1:(sk?.9:.55);
    const head=(p0,p1)=>{const mx=(p0.x+p1.x)/2,my=(p0.y+p1.y)/2,a=Math.atan2(p1.y-p0.y,p1.x-p0.x)*180/Math.PI;return`<polygon points="${-asz},${-asz*.62} ${asz},0 ${-asz},${asz*.62}" fill="${col}" fill-opacity="${aop}" transform="translate(${mx},${my}) rotate(${a})"/>`};
    if(arrow==="end"||arrow==="both"){const li=pts.length-1;h+=head(pts[li-1],pts[li])}
    if(arrow==="both")h+=head(pts[1],pts[0]);

/* ═══ PORT-LABEL DOCKING ═══
   Angedockte Labels speichern {seg,t,off}: seg = Teilstrecke der Verbindung
   (zwischen zwei Knoten bzw. Wegpunkten), t = prozentuale Position auf genau
   dieser Teilstrecke (0..1), off = senkrechter Abstand zur Linie. Bewegt sich
   ein Knoten, bleibt das Verhältnis auf seiner Teilstrecke erhalten. */
function plSegs(L){
  const pts=L.pts,ns=L.nSegs||Math.floor(pts.length/2),segs=[];
  for(let s=0;s<ns;s++){
    const a=pts[s*2],b=pts[s*2+1];if(!a||!b)continue;
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1e-6;
    segs.push({a,ux:dx/len,uy:dy/len,nx:-dy/len,ny:dx/len,len});
  }
  return segs;
}
function plPointAt(L,pl){
  const segs=plSegs(L);if(!segs.length||!pl)return null;
  const s=segs[Math.max(0,Math.min(segs.length-1,pl.seg|0))];
  const k=Math.max(0,Math.min(1,pl.t||0))*s.len,o=pl.off||0;
  return{x:s.a.x+s.ux*k+s.nx*o,y:s.a.y+s.uy*k+s.ny*o};
}
function plProject(L,x,y){
  const segs=plSegs(L);if(!segs.length)return null;
  let best=null;
  segs.forEach((s,i)=>{
    const k=Math.max(0,Math.min(s.len,(x-s.a.x)*s.ux+(y-s.a.y)*s.uy));
    const px=s.a.x+s.ux*k,py=s.a.y+s.uy*k,dx=x-px,dy=y-py,dist=dx*dx+dy*dy;
    if(!best||dist<best.dist)best={dist,seg:i,t:k/s.len,off:dx*s.nx+dy*s.ny};
  });
  return{seg:best.seg,t:best.t,off:best.off};
}
/* Altformat {t,off} über den Gesamtpfad -> Position für die Umrechnung */
function plPointAtGlobal(pts,t,off){
  const segs=[];let total=0;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy);
    if(len<1e-6)continue;
    segs.push({a,ux:dx/len,uy:dy/len,nx:-dy/len,ny:dx/len,len,start:total});total+=len;
  }
  if(!segs.length)return null;
  const d=Math.max(0,Math.min(1,t||0))*total;
  let s=segs[segs.length-1];
  for(const sg of segs){if(d<=sg.start+sg.len){s=sg;break}}
  const k=Math.max(0,Math.min(s.len,d-s.start)),o=off||0;
  return{x:s.a.x+s.ux*k+s.nx*o,y:s.a.y+s.uy*k+s.ny*o};
}
function plLine(cid){return computeLines().find(x=>x.c.id===cid)}
function plIsDocked(c){return !c.plFree}
/* Route ändern, ohne dass das Label springt: Position vorher merken, danach
   auf die neue Teilstrecke projizieren */
function preservePl(c,mutate){
  const ox=c.lx,oy=c.ly;mutate();
  if(!c.plFree&&c.pl!=null&&ox!=null){const L=plLine(c.id);if(L){const d=plProject(L,ox,oy);if(d)c.pl=d}}
}
function togglePlDock(cid){
  const c=conns.find(cn=>cn.id===cid);if(!c)return;
  if(c.plFree){
    c.plFree=false;
    const L=plLine(cid);
    if(L&&c.lx!=null){const d=plProject(L,c.lx,c.ly);if(d)c.pl=d}
  }else{c.plFree=true}
  render();
}

function renderPL(){
  document.querySelectorAll(".port-label").forEach(el=>el.remove());
  if(!portsVisible())return;

    const c=L.c,col=c.color||"#888",ps=c.port||"";
    let lx,ly;
    /* Altbestand: absolute Position bzw. Gesamtpfad-Anteil einmalig umrechnen */
    if(!c.plFree&&c.pl!=null&&c.pl.seg===undefined){const p=plPointAtGlobal(L.pts,c.pl.t,c.pl.off),d=p&&plProject(L,p.x,p.y);if(d)c.pl=d}
    if(c.pl==null&&!c.plFree&&c.lx!=null){const d=plProject(L,c.lx,c.ly);if(d)c.pl=d}
    if(plIsDocked(c)&&c.pl!=null){
      const p=plPointAt(L,c.pl);
      if(p){ld.push({L,col,ps,lx:p.x,ly:p.y,man:true,docked:true});return}
    }
    if(c.plFree&&c.lx!=null){ld.push({L,col,ps,lx:c.lx,ly:c.ly,man:true,docked:false});return}
    const p0=L.pts[0],p1=L.pts[1]||p0,t=.3;

    lx+=(-dy/len)*12;ly+=(dx/len)*12;

  ld.forEach(l=>{

    el.addEventListener("contextmenu",function(e){if(e.target.tagName==="TEXTAREA")return;e.preventDefault();e.stopPropagation();togglePlDock(l.L.c.id)});
    const ck=l.L.key;
    const ta=document.createElement("textarea");
    ta.value=l.ps||"";ta.placeholder=isSketch()?"Text":"Port(s)";ta.style.cssText=`color:${ink(l.col)};border-color:${l.col}33`;
    if(l.L.c.plw&&!isSketch()){ta.style.width=l.L.c.plw+"px";ta.style.height=(l.L.c.plh||16)+"px";ta.style.fieldSizing="fixed"}
    ta.addEventListener("click",function(e){e.stopPropagation();openConnPopover(l.L.c.id,e.clientX,e.clientY)});
    ta.addEventListener("input",function(){const cn=conns.find(c=>c.id===l.L.c.id);if(cn){cn.port=this.value;scheduleLocalSave()}});
    ta.addEventListener("mousemove",function(e){const r=this.getBoundingClientRect();this.style.cursor=(r.right-e.clientX<10&&r.bottom-e.clientY<10)?"nwse-resize":"pointer"});
    ta.addEventListener("mousedown",function(e){const r=this.getBoundingClientRect();if(r.right-e.clientX>10||r.bottom-e.clientY>10)return;e.preventDefault();e.stopPropagation();const sx=e.clientX,sy=e.clientY,sw=this.offsetWidth,sh=this.offsetHeight,self=this;function mv(ev){self.style.fieldSizing="fixed";self.style.width=Math.max(30,sw+(ev.clientX-sx)/zoom)+"px";self.style.height=Math.max(16,sh+(ev.clientY-sy)/zoom)+"px"}function up(){document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);const cn=conns.find(c=>c.id===l.L.c.id);if(cn){cn.plw=self.offsetWidth;cn.plh=self.offsetHeight}}document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up)});
    el.innerHTML=`<div class="pl-dot" title="${l.docked?"Angedockt · Rechtsklick zum Lösen":"Frei platziert · Rechtsklick zum Andocken"}" style="${l.docked?`background:${l.col}`:`background:transparent;box-shadow:inset 0 0 0 1.2px ${l.col}`}"></div>`;el.appendChild(ta);
